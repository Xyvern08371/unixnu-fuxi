name: official-kernel

# 按 UniXNU 官方教程编译 fuxi 内核：
#   ./unixnu defconfig fuxi_defconfig
#   ./unixnu fetch
#   ./unixnu build kernel
#
# 驱动仓库：UniXNU/UniXNU（官方框架）
# 设备仓库：hanzi123-bilp/unixnu-fuxi（官方设备页指定的 fuxi 端口）
# 日志无论成败都推到 ci-logs 分支，方便本地读取。

# trigger: ufs pass
on:
  push:
    paths:
      - ".github/workflows/official-kernel.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-kernel-${{ github.ref }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  DEFCONFIG: fuxi_defconfig

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      UNIXNU_DEVICE: ${{ github.workspace }}/device
    steps:
      - name: 取本仓库（日志推回用）
        uses: actions/checkout@v4
        with:
          path: ourrepo

      - name: 取 UniXNU（官方框架）
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: unixnu
          persist-credentials: false

      - name: 取设备仓库（官方 fuxi 端口）
        uses: actions/checkout@v4
        with:
          repository: hanzi123-bilp/unixnu-fuxi
          path: device
          persist-credentials: false

      - name: 装依赖
        run: |
          brew install llvm lld mtools dtc unifdef || true
          if ! command -v unifdef >/dev/null; then
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: 报告工具链
        run: |
          sw_vers
          uname -m
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-version || true
          xcrun --sdk iphoneos --find mig || true
          for t in git make clang cmake ninja unifdef ld.lld mformat mcopy dtc; do
            printf '%-10s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done

      - name: 打开 CONFIG_XNU_BUILD_ARCHIVES
        run: |
          set +e
          set -x
          F=device/configs/$DEFCONFIG
          grep -q '^CONFIG_XNU_BUILD_ARCHIVES=y' "$F" || echo 'CONFIG_XNU_BUILD_ARCHIVES=y' >> "$F"
          # 这个「控制台版」配置开着 BOOT_PROGRESS，但构建脚本要求 UFS/owner-root/
          # virtio/corecrypto 全在，否则直接 exit 1。关掉它才能编过。
          python3 - "$F" <<'PY'
          import io, sys, re
          p = sys.argv[1]
          t = io.open(p, encoding='utf-8').read()
          t = re.sub(r'(?m)^CONFIG_XNU_BOOT_PROGRESS=.*$', 'CONFIG_XNU_BOOT_PROGRESS=n', t)
          if 'CONFIG_XNU_BOOT_PROGRESS=' not in t:
              t += 'CONFIG_XNU_BOOT_PROGRESS=n\n'
          io.open(p, 'w', encoding='utf-8', newline='\n').write(t)
          print('BOOT_PROGRESS ->', [l for l in t.split('\n') if 'BOOT_PROGRESS' in l])
          PY
          tail -6 "$F"

      - name: 只保留 legacy-stub 这一个 archive
        run: |
          set -x
          python3 - <<'PY'
          import io, re, tomllib
          p = 'device/board.toml'
          src = io.open(p, encoding='utf-8').read()
          m = re.search(r'archives\s*=\s*\[(?:[^\[\]]|\n)*?\]', src)
          assert m, 'archives block not found'
          keep = [
              "build-corecrypto-14.py",
              "build-corecrypto-14.py --namespace",
              "build-arm-driver.py ArmDTPlatform",
              "build-arm-driver.py ArmCpu",
              "build-arm-driver.py NativeAES",
              "build-native-aes-bindings.py",
              "build-libpthread-kernel.py",
              "build-legacy-stub.py",
          ]
          new = 'archives = [\n' + ''.join('    "%s",\n' % k for k in keep) + '  ]'
          out = src[:m.start()] + new + src[m.end():]
          d = tomllib.loads(out)
          assert len(d['kernel']['archives']) == 8, d['kernel']['archives']
          io.open(p, 'w', encoding='utf-8', newline='\n').write(out)
          print('archives ->', d['kernel']['archives'])
          PY

      - name: 补 kits/sheng（设备仓库的链接名目录是空的）
        run: |
          set -x
          mkdir -p device/kits/sheng
          for f in device/package/*; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            [ -e "device/kits/sheng/$b" ] || cp "$f" "device/kits/sheng/$b"
          done
          ls -la device/kits/sheng | head -20
          echo "--- 检查 stub 源 ---"
          ls -l device/kits/sheng/LegacyDisplayStub.c || echo "STUB MISSING"

      - name: 选择设备
        working-directory: unixnu
        run: ./unixnu defconfig "$DEFCONFIG"

      - name: 拉源码
        working-directory: unixnu
        run: ./unixnu fetch

      - name: 给 prepare-xnu-source.py 加 token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          F=unixnu/out/fuxi/tree/scripts/prepare-xnu-source.py
          ls -l "$F" || exit 0
          python3 - "$F" <<'PY'
          import io, sys, os
          p = sys.argv[1]
          t = io.open(p, encoding='utf-8').read()
          if 'GITHUB_TOKEN' in t:
              print('already patched'); raise SystemExit(0)
          old = 'with urllib.request.urlopen(request, timeout=30) as response:'
          new = ('_tok = os.environ.get("GITHUB_TOKEN") or ""\n'
                 '    if _tok:\n'
                 '        request.add_header("Authorization", "Bearer " + _tok)\n'
                 '    request.add_header("User-Agent", "unixnu-build")\n'
                 '    with urllib.request.urlopen(request, timeout=30) as response:')
          if old not in t:
              print('ANCHOR NOT FOUND'); raise SystemExit(1)
          t = t.replace(old, new, 1)
          io.open(p, 'w', encoding='utf-8').write(t)
          print('patched')
          PY

      - name: 放 uefi-sheng 树（payload 的 panic 屏要 Font.h）
        working-directory: unixnu
        run: |
          set -x
          T=out/fuxi/tree/uefi-sheng
          if [ ! -d "$T/Silicon/Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib" ]; then
            rm -rf "$T"
            git clone --depth 1 https://github.com/hanzi123-bilp/uefi-fuxi.git "$T" 2>&1 | tail -3
          fi
          ls -l "$T/Silicon/Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib/Font.h" || echo "FONT MISSING"

      - name: 编内核（两遍）+ payload
        working-directory: unixnu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNIXNU_UNIQUE_CHIP_ID: "0123456789ABCDEF"
        run: |
          set -x
          mkdir -p "$GITHUB_WORKSPACE/ourrepo/ci-logs-official"
          LOG2="$GITHUB_WORKSPACE/ourrepo/ci-logs-official/pass2.log"
          : > "$LOG2"
          echo "=== PASS1: fuxi_defconfig ===" | tee -a "$LOG2"
          ./unixnu build kernel 2>&1 | tee -a "$LOG2"
          echo "PASS1_EXIT=$?" | tee -a "$LOG2"

          echo "=== 恢复完整 archives ===" | tee -a "$LOG2"
          python3 - <<'PY' 2>&1 | tee -a "$LOG2"
          import io, re
          full = [
              "build-corecrypto-14.py",
              "build-corecrypto-14.py --namespace",
              "build-arm-driver.py ArmDTPlatform",
              "build-arm-driver.py ArmCpu",
              "build-arm-driver.py NativeAES",
              "build-arm-driver.py NativeVirtioBlock --verified-root --verified-root-bundle",
              "audit-storage-interface.py",
              "build-arm-driver.py NativeUfs",
              "build-native-aes-bindings.py",
              "build-boot-progress.py",
              "build-libpthread-kernel.py",
              "build-legacy-stub.py",
          ]
          block = 'archives = [\n' + ''.join('    "%s",\n' % k for k in full) + '  ]'
          for p in ('../device/board.toml', 'out/fuxi/tree/board.toml'):
              try:
                  s = io.open(p, encoding='utf-8').read()
              except FileNotFoundError:
                  print('missing', p); continue
              m = re.search(r'archives\s*=\s*\[(?:[^\[\]]|\n)*?\]', s)
              if not m:
                  print('no block', p); continue
              io.open(p, 'w', encoding='utf-8', newline='\n').write(s[:m.start()] + block + s[m.end():])
              print('restored', p)
          # fuxi_full_defconfig 缺 CONFIG_XNU_NATIVE_VIRTIO_BLOCK=y，
          # 而 boot-progress 的硬性检查要求 UFS/owner-root/virtio/corecrypto 全在
          cfg = '../device/configs/fuxi_full_defconfig'
          s = io.open(cfg, encoding='utf-8').read()
          if 'CONFIG_XNU_NATIVE_VIRTIO_BLOCK=y' not in s:
              s = s.replace('CONFIG_XNU_NATIVE_VIRTIO_BLOCK_ARCHIVE',
                            'CONFIG_XNU_NATIVE_VIRTIO_BLOCK=y\nCONFIG_XNU_NATIVE_VIRTIO_BLOCK_ARCHIVE', 1)
              io.open(cfg, 'w', encoding='utf-8', newline='\n').write(s)
              print('added CONFIG_XNU_NATIVE_VIRTIO_BLOCK=y')
          PY

          echo "=== PASS2: fuxi_full_defconfig ===" | tee -a "$LOG2"
          ./unixnu defconfig fuxi_full_defconfig 2>&1 | tee -a "$LOG2"
          echo "DEFCONFIG_EXIT=$?" | tee -a "$LOG2"
          ./unixnu build kernel 2>&1 | tee -a "$LOG2"
          echo "PASS2_EXIT=$?" | tee -a "$LOG2"

          echo "=== payload ===" | tee -a "$LOG2"
          ./unixnu build payload 2>&1 | tee -a "$LOG2"
          echo "PAYLOAD_EXIT=$?" | tee -a "$LOG2"
          cp "$LOG2" /tmp/build-payload.log 2>/dev/null

      - name: 列出产物
        if: always()
        working-directory: unixnu
        run: |
          set +e
          echo "===== 产物 ====="
          find . -maxdepth 7 \( -name 'mach.*' -o -name 'kernel.*' -o -name 'payload.img' -o -name 'payload.json' -o -name 'boot.img' \) 2>/dev/null | head -40 || true
          ls -la build 2>/dev/null | head -20
          ls -l out/fuxi/kernel/kernel.macho out/fuxi/payload/payload.img 2>/dev/null
          true

      - name: 上传内核
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-kernel-unixnu
          path: |
            unixnu/build/**
            /tmp/build-kernel.log
          if-no-files-found: warn
          retention-days: 14

      - name: 上传二进制到 Release
        id: release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: unixnu
        run: |
          set +e
          TAG="fuxi-$(date +%Y%m%d-%H%M%S)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          files=""
          for f in out/fuxi/payload/payload.img out/fuxi/kernel/kernel.macho; do
            [ -f "$f" ] && files="$files $f"
          done
          echo "assets:$files"
          if [ -n "$files" ]; then
            gh release create "$TAG" $files --repo "$GITHUB_REPOSITORY" \
              --title "fuxi unixnu build $TAG" --notes "kernel + payload" || echo "release failed"
          fi

      - name: 把文本日志推到 ci-logs
        if: always()
        working-directory: ourrepo
        run: |
          set +e
          mkdir -p ci-logs-official/unixnu-logs
          cp ci-logs-official/pass2.log ci-logs-official/build-kernel2.log 2>/dev/null
          cp /tmp/build-kernel.log ci-logs-official/build-kernel.log 2>/dev/null
          cp /tmp/build-payload.log ci-logs-official/build-payload.log 2>/dev/null
          cp -r ../unixnu/out/fuxi/logs/. ci-logs-official/unixnu-logs/ 2>/dev/null
          {
            echo "=== 产物 ==="
            ls -l ../unixnu/out/fuxi/kernel/kernel.macho ../unixnu/out/fuxi/payload/payload.img 2>/dev/null
            echo
            echo "=== Release tag ==="
            echo "${{ steps.release.outputs.tag }}"
            echo
            echo "=== payload 日志尾部 80 行 ==="
            tail -80 /tmp/build-payload.log 2>/dev/null
          } > ci-logs-official/tail.txt
          git config user.name "xnu-bot"
          git config user.email "xnu-bot@users.noreply.github.com"
          git checkout -f --orphan official-logs-tmp
          git add -f ci-logs-official
          git commit -qm "unixnu fuxi kernel log" || true
          git push -f origin HEAD:ci-logs || echo "push failed"
