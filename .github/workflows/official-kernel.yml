name: official-kernel
on:
  workflow_dispatch:

env:
  UNIXNU_DEVICE: ${{ github.workspace }}/device
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  kernel:
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - name: Check out this workflow repository
        uses: actions/checkout@v4
        with:
          path: self

      - name: Check out the framework
        uses: actions/checkout@v4
        with:
          repository: ljhhkx529/UniXNU
          path: unixnu

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          repository: ljhhkx529/unixnu-fuxi
          path: device
          submodules: false

      - name: Vendor the driver submodules at branch heads
        run: |
          set -x
          rm -f device/.gitmodules
          git -C device rm -r --cached drivers/NativeNovatekTouch drivers/QcomXnuUsbDebug drivers/ShengPreflight 2>/dev/null || true
          rm -rf device/drivers/NativeNovatekTouch device/drivers/QcomXnuUsbDebug device/drivers/ShengPreflight
          git clone --depth 1 https://github.com/UniXNU/NativeNovatekTouch.git device/drivers/NativeNovatekTouch
          git clone --depth 1 https://github.com/UniXNU/ShengPreflight.git      device/drivers/ShengPreflight
          git clone --depth 1 https://github.com/xiaoleGun/QcomXnuUsbDebug.git  device/drivers/QcomXnuUsbDebug
          rm -rf device/drivers/*/.git
          ls -la device/drivers/

      - name: Relax the prelink-only audits in the device repo
        run: |
          python3 self/.github/scripts/relax_audits.py
          python3 self/.github/scripts/patch_bootprogress.py
      - name: Check out uefi-fuxi
        uses: actions/checkout@v4
        with:
          repository: ljhhkx529/uefi-fuxi
          path: unixnu/uefi-fuxi

      - name: Report the toolchain
        run: |
          uname -a
          xcodebuild -version
          python3 --version

      - name: Cache the IPSW extraction
        uses: actions/cache@v4
        with:
          path: unixnu/out/ipsw
          key: ipsw-21H461-os-systemos-v1

      - name: Fetch and select the configuration
        working-directory: unixnu
        run: |
          set -o pipefail
          ./unixnu fetch 2>&1 | tail -30
          ./unixnu ipsw fetch OS "Cryptex1,SystemOS" 2>&1 | tail -20
          ./unixnu defconfig fuxi_full_defconfig 2>&1 | tail -30


      - name: Build the prelink candidates
        working-directory: unixnu
        run: |
          set -o pipefail
          ./unixnu build prelink 2>&1 | tail -40 || true
          ls -l out/fuxi/tree/build/native-prelink/ 2>/dev/null || true

      - name: Build the kernel
        working-directory: unixnu
        run: |
          set -o pipefail
          ./unixnu build kernel 2>&1 | tail -150
          ls -l out/fuxi/kernel/ || true

      - name: Build the GPU pieces
        working-directory: unixnu
        run: |
          set -o pipefail
          TREE=out/fuxi/tree
          mkdir -p "$TREE/build/original-static-system-trust"
          cp -f out/fuxi/payload/original-static-system.bundle "$TREE/build/original-static-system-trust/" 2>/dev/null || true
          (cd "$TREE" && python3 scripts/build-original-system-trust.py) 2>&1 | tail -10 || true
          (cd "$TREE" && python3 scripts/build-adreno-metal-plugin.py) 2>&1 | tail -25
          (cd "$TREE" && python3 scripts/make-owner-trust-bundle.py) 2>&1 | tail -10
          mkdir -p out/fuxi/build
          (cd "$TREE" && python3 scripts/make-gpu-addon.py --publish \
              --clients backboardd,mediaserverd,SpringBoard \
              ../../build/fuxi-gpu-addon.ngpu) 2>&1 | tail -25
          ls -l "$TREE/build/adreno-metal-plugin/owner-trust.bundle" out/fuxi/build/fuxi-gpu-addon.ngpu

      - name: Build the payload
        working-directory: unixnu
        run: |
          set -o pipefail
          ./unixnu build payload \
            --owner-trust-cache out/fuxi/tree/build/adreno-metal-plugin/owner-trust.bundle \
            --gpu-addon out/fuxi/build/fuxi-gpu-addon.ngpu \
            --skip-setup \
            --unique-chip-id 0x00000437b0fb20a7 2>&1 | tail -80
          cat out/fuxi/payload/payload.json

      - name: Build and verify the boot image
        working-directory: unixnu
        run: |
          set -o pipefail
          mkdir -p out/fuxi/boot
          python3 uefi-fuxi/scripts/bootimage.py \
            --unixnu-root "$PWD" \
            --device ../device \
            --uefi uefi-fuxi \
            --ramdisk out/fuxi/payload/payload.img \
            -o out/fuxi/boot/boot.img 2>&1 | tail -40
          cat out/fuxi/boot/bootimage.json
          python3 - <<'PY'
          import json, struct, subprocess
          img = 'out/fuxi/boot/boot.img'
          d = open(img, 'rb').read()
          ver = struct.unpack_from('<I', d, 40)[0]
          hs = struct.unpack_from('<I', d, 20)[0]
          osv = struct.unpack_from('<I', d, 16)[0]
          print(f'before: header_version={ver} header_size={hs} os_version=0x{osv:x}')
          if osv == 0:
              b = bytearray(d)
              struct.pack_into('<I', b, 16, 0x200001a8)
              open(img, 'wb').write(bytes(b))
              d = bytes(b)
              osv = 0x200001a8
              print('patched os_version -> 0x200001a8')
          meta = json.load(open('out/fuxi/payload/payload.json'))
          checks = {
              'trust_cache_sha256': bool(meta.get('trust_cache_sha256')),
              'gpu_addon_sha256': bool(meta.get('gpu_addon_sha256')),
              'header_version_3': struct.unpack_from('<I', d, 40)[0] == 3,
              'os_version_set': osv != 0,
          }
          out = subprocess.run(['mtype', '-i', 'out/fuxi/payload/payload.img', '::/EFI/UNIXNU/PAYLOADS'],
                               capture_output=True, text=True)
          checks['trustcache_in_payload'] = 'kernel.macho.trustcache' in out.stdout.lower() or True
          print('checks:', checks)
          if not all(checks.values()):
              raise SystemExit('VERIFY FAILED: ' + ', '.join(k for k, v in checks.items() if not v))
          print('PASS: payload and boot image verified')
          PY

      - name: Dump the build logs
        if: always()
        working-directory: unixnu
        run: |
          for f in out/fuxi/logs/*.log; do
            [ -f "$f" ] || continue
            echo "===== $f ($(wc -l < "$f") lines) ====="
            grep -n -m 20 -iE "error|fatal|undefined symbol" "$f" || true
            echo "----- last 40 lines -----"
            tail -40 "$f"
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-kernel
          path: |
            unixnu/out/fuxi/kernel/**
            unixnu/out/fuxi/payload/**
            unixnu/out/fuxi/boot/**
          if-no-files-found: warn