name: official-kernel
on:
  workflow_dispatch:

jobs:
  kernel:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - name: Check out the framework
        uses: actions/checkout@v4
        with:
          path: unixnu

      - name: Check out the device repository (ljhhkx529)
        uses: actions/checkout@v4
        with:
          repository: ljhhkx529/unixnu-fuxi
          path: device
          submodules: recursive

      - name: Check out uefi-fuxi (the board DTB lives there)
        uses: actions/checkout@v4
        with:
          repository: ljhhkx529/uefi-fuxi
          path: unixnu/uefi-fuxi
          submodules: recursive

      - name: Install dependencies
        run: brew install llvm lld gnu-sed coreutils openssl@3 || true

      - name: Report the toolchain
        run: |
          uname -a
          xcodebuild -version
          python3 --version

      - name: Prepare
        working-directory: unixnu
        run: |
          set -x
          python3 unixnu --help | head -20
          python3 unixnu ipsw fetch OS "Cryptex1,SystemOS" 2>&1 | tail -20
          python3 unixnu defconfig fuxi_full_defconfig -D ../device 2>&1 | tail -20

      - name: Build the kernel
        working-directory: unixnu
        run: |
          set -o pipefail
          python3 unixnu build kernel -D ../device 2>&1 | tail -120
          echo "KERNEL_EXIT=$?"
          ls -l out/fuxi/kernel/ || true

      - name: Build the payload
        working-directory: unixnu
        run: |
          set -o pipefail
          python3 unixnu build payload -D ../device 2>&1 | tail -60
          echo "PAYLOAD_EXIT=$?"
          ls -l out/fuxi/payload/ || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-kernel
          path: |
            unixnu/out/fuxi/kernel/**
            unixnu/out/fuxi/payload/**
          if-no-files-found: warn