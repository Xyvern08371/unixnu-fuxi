name: official-kernel

# 按 UniXNU 官方教程编译 fuxi 内核：
#   ./unixnu defconfig fuxi_defconfig
#   ./unixnu fetch
#   ./unixnu build kernel
#
# 驱动仓库：UniXNU/UniXNU（官方框架）
# 设备仓库：Xyvern08371/fuxi-dev（官方设备页指定的 fuxi 端口）
# 日志无论成败都推到 ci-logs 分支，方便本地读取。

# trigger: ufs pass
on:
  push:
    paths:
      - ".github/workflows/official-kernel.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-kernel-${{ github.ref }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  DEFCONFIG: fuxi_defconfig

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      UNIXNU_DEVICE: ${{ github.workspace }}/device
    steps:
      - name: 取本仓库（日志推回用）
        uses: actions/checkout@v4
        with:
          path: ourrepo

      - name: 取 UniXNU（官方框架）
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: unixnu
          persist-credentials: false

      - name: 取设备仓库（官方 fuxi 端口）
        uses: actions/checkout@v4
        with:
          repository: Xyvern08371/fuxi-dev
          path: device
          persist-credentials: false

      - name: 装依赖
        run: |
          brew install llvm lld mtools dtc unifdef || true
          if ! command -v unifdef >/dev/null; then
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: 报告工具链
        run: |
          sw_vers
          uname -m
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-version || true
          xcrun --sdk iphoneos --find mig || true
          for t in git make clang cmake ninja unifdef ld.lld mformat mcopy dtc; do
            printf '%-10s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done

      - name: 打开 CONFIG_XNU_BUILD_ARCHIVES
        run: |
          set +e
          set -x
          F=device/configs/$DEFCONFIG
          grep -q '^CONFIG_XNU_BUILD_ARCHIVES=y' "$F" || echo 'CONFIG_XNU_BUILD_ARCHIVES=y' >> "$F"
          # 这个「控制台版」配置开着 BOOT_PROGRESS，但构建脚本要求 UFS/owner-root/
          # virtio/corecrypto 全在，否则直接 exit 1。关掉它才能编过。
          python3 - "$F" <<'PY'
          import io, sys, re
          p = sys.argv[1]
          t = io.open(p, encoding='utf-8').read()
          # round 20: device repo carries drivers/NativeMetal + drivers/NativeMobileDisplay
          # keep CONFIG_XNU_BOOT_PROGRESS as the device repo defines it: the boot-progress kit
          # must compile with the same records in both passes (forcing n breaks BootProgress.c)
          io.open(p, 'w', encoding='utf-8', newline='\n').write(t)
          print('BOOT_PROGRESS ->', [l for l in t.split('\n') if 'BOOT_PROGRESS' in l])
          PY
          tail -6 "$F"

      - name: 只保留 legacy-stub 这一个 archive
        run: |
          set -x
          python3 - <<'PY'
          import io, re, tomllib
          p = 'device/board.toml'
          src = io.open(p, encoding='utf-8').read()
          m = re.search(r'archives\s*=\s*\[(?:[^\[\]]|\n)*?\]', src)
          assert m, 'archives block not found'
          import shutil
          shutil.copyfile(p, '/tmp/board.full.toml')
          print('backed up full board.toml')
          keep = [
              "build-corecrypto-14.py",
              "build-corecrypto-14.py --namespace",
              "build-arm-driver.py ArmDTPlatform",
              "build-arm-driver.py ArmCpu",
              "build-arm-driver.py NativeAES",
              "build-native-aes-bindings.py",
              "build-libpthread-kernel.py",
              "build-legacy-stub.py",
              "build-boot-log.py",
              "build-fuxi-usb-debug.py",
          ]
          print('archives kept as-is:', len(tomllib.loads(src)['kernel']['archives']))
          PY

      - name: 补 kits/sheng（设备仓库的链接名目录是空的）
        run: |
          set -x
          mkdir -p device/kits/sheng
          for f in device/package/*; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            [ -e "device/kits/sheng/$b" ] || cp "$f" "device/kits/sheng/$b"
          done
          ls -la device/kits/sheng | head -20
          echo "--- 检查 stub 源 ---"
          ls -l device/kits/sheng/LegacyDisplayStub.c || echo "STUB MISSING"
      - name: Pin the TZ-accepted a740_zap (12088 B)
        run: |
          set -euxo pipefail
          mkdir -p device/.cache/firmware/fuxi-gpu/qcom/sm8550/fuxi
          ZAP=device/.cache/firmware/fuxi-gpu/qcom/sm8550/fuxi/a740_zap.mbn
          curl -fsSL https://raw.githubusercontent.com/Xyvern08371/fuxi-zap/main/a740_zap.mbn -o "$ZAP"
          wc -c "$ZAP"
          echo "fd107982f9b06b40c85474c6c7288f43f77ea9b02f210df05f501cb2ee296e13  $ZAP" | sha256sum -c -
          python3 - <<'PY'
          import io, json, glob, sys
          import os
          cands = []
          for base in ('device/scripts/data', 'unixnu/scripts/data'):
              if os.path.isdir(base):
                  for fn in os.listdir(base):
                      if 'adreno' in fn and 'inputs' in fn and fn.endswith('.json'):
                          cands.append(os.path.join(base, fn))
          cands = sorted(set(cands))
          print('candidates:', cands)
          if not cands:
              sys.exit('no adreno inputs json found')
          newpin = {
              'repository': 'https://github.com/Xyvern08371/fuxi-zap',
              'git_blob_sha1': '626393afe52f647089754638a909834bd37a8604',
              'bytes': 12088,
              'sha256': 'fd107982f9b06b40c85474c6c7288f43f77ea9b02f210df05f501cb2ee296e13',
          }
          sqepin = {
              'repository': 'https://github.com/hanzi123-bilp/uefi-fuxi',
              'git_blob_sha1': '692657ccd54e617ea5cba7cb348075c33fbbf7f9',
              'bytes': 76724,
              'sha256': '96fee336424b139100fc60b5b45a907360e4b3936d7e1d00406b9bd80ca48473',
          }
          for p in cands:
              d = json.load(io.open(p, encoding='utf-8'))
              files = d.get('firmware', {}).get('files')
              if not isinstance(files, dict):
                  print('skip', p); continue
              hits = [k for k in files if 'zap' in k.lower()]
              for kq in [x for x in files if 'a740_sqe' in x.lower()]:
                  files[kq] = sqepin
                  print(p, 'sqe ->', kq, sqepin['bytes'])
              if hits:
                  for k in hits:
                      print(p, 'old', k, files[k].get('bytes'))
                      files[k] = newpin
                      print(p, 'new', k, newpin['bytes'])
              else:
                  files['qcom/sm8550/fuxi/a740_zap.mbn'] = newpin
                  print(p, 'added key')
              io.open(p, 'w', encoding='utf-8', newline='\n').write(json.dumps(d, indent=2) + '\n')
          PY

      - name: 选择设备
        working-directory: unixnu
        run: ./unixnu defconfig "$DEFCONFIG"

      - name: 拉源码
        working-directory: unixnu
        run: ./unixnu fetch

      - name: 给 prepare-xnu-source.py 加 token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          F=unixnu/out/fuxi/tree/scripts/prepare-xnu-source.py
          ls -l "$F" || exit 0
          python3 - "$F" <<'PY'
          import io, sys, os
          p = sys.argv[1]
          t = io.open(p, encoding='utf-8').read()
          if 'GITHUB_TOKEN' in t:
              print('already patched'); raise SystemExit(0)
          old = 'with urllib.request.urlopen(request, timeout=30) as response:'
          new = ('_tok = os.environ.get("GITHUB_TOKEN") or ""\n'
                 '    if _tok:\n'
                 '        request.add_header("Authorization", "Bearer " + _tok)\n'
                 '    request.add_header("User-Agent", "unixnu-build")\n'
                 '    with urllib.request.urlopen(request, timeout=30) as response:')
          if old not in t:
              print('ANCHOR NOT FOUND'); raise SystemExit(1)
          t = t.replace(old, new, 1)
          io.open(p, 'w', encoding='utf-8').write(t)
          print('patched')
          PY

      - name: 放 uefi-sheng 树（payload 的 panic 屏要 Font.h）
        working-directory: unixnu
        run: |
          set -x
          T=out/fuxi/tree/uefi-sheng
          if [ ! -d "$T/Silicon/Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib" ]; then
            rm -rf "$T"
            git clone --depth 1 https://github.com/hanzi123-bilp/uefi-fuxi.git "$T" 2>&1 | tail -3
          fi
          ls -l "$T/Silicon/Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib/Font.h" || echo "FONT MISSING"

      - name: 编内核（两遍）+ payload
        working-directory: unixnu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNIXNU_UNIQUE_CHIP_ID: "0123456789ABCDEF"
        run: |
          set -x
          mkdir -p "$GITHUB_WORKSPACE/ourrepo/ci-logs-official"
          LOG2="$GITHUB_WORKSPACE/ourrepo/ci-logs-official/pass2.log"
          : > "$LOG2"
          export FUXI_DTB="$PWD/out/fuxi/tree/uefi-sheng/Resources/DTBs/fuxi.dtb"
          ls -l "$FUXI_DTB" || echo "DTB MISSING"
          ln -sfn uefi-sheng out/fuxi/tree/uefi-fuxi || true
          ./unixnu defconfig fuxi_full_defconfig 2>&1 | tee -a "$LOG2"
          FW=device/.cache/firmware
          mkdir -p "$FW/sheng-gpu/qcom/sm8550/sheng" "$FW/fuxi-gpu/qcom/sm8550/fuxi"
          SB=https://raw.githubusercontent.com/ianchb/sheng-firmware/2c1e2729a085c7f0470c855d236e49455c4601f0
          FF=https://raw.githubusercontent.com/hanzi123-bilp/uefi-fuxi/fuxi/fuxi-loader-build
          ZB=https://raw.githubusercontent.com/Xyvern08371/fuxi-zap/main/a740_zap.mbn
          curl -fsSL "$SB/qcom/a740_sqe.fw" -o "$FW/sheng-gpu/qcom/a740_sqe.fw" || echo "sheng SQE FAIL"
          curl -fsSL "$SB/qcom/gmu_gen70200.bin" -o "$FW/sheng-gpu/qcom/gmu_gen70200.bin" || echo "sheng GMU FAIL"
          curl -fsSL "$ZB" -o "$FW/sheng-gpu/qcom/sm8550/sheng/a740_zap.mbn" || echo "sheng ZAP FAIL"
          curl -fsSL "$FF/gmu_gen70200.bin" -o "$FW/fuxi-gpu/qcom/gmu_gen70200.bin" || echo "fuxi GMU FAIL"
          curl -fsSL "$FF/a740_sqe.fw" -o "$FW/fuxi-gpu/qcom/sm8550/fuxi/a740_sqe.fw" || echo "fuxi SQE FAIL"
          curl -fsSL "$ZB" -o "$FW/fuxi-gpu/qcom/sm8550/fuxi/a740_zap.mbn" || echo "fuxi ZAP FAIL"
          AC=out/fuxi/tree/.cache/adreno-source
          LC=https://raw.githubusercontent.com/ianchb/sm8550-mainline/42f3b40c702abbc37c3a04c95af008cd283aeaf3
          for f in \
            drivers/gpu/drm/msm/adreno/a6xx_catalog.c \
            drivers/gpu/drm/msm/adreno/a6xx_gpu.c \
            drivers/gpu/drm/msm/adreno/a6xx_gmu.c \
            drivers/gpu/drm/msm/adreno/a6xx_gmu.h \
            drivers/gpu/drm/msm/adreno/adreno_gpu.h \
            drivers/gpu/drm/msm/msm_iommu.c \
            drivers/gpu/drm/msm/registers/adreno/adreno_pm4.xml \
            drivers/gpu/drm/msm/registers/adreno/a6xx.xml \
            drivers/iommu/io-pgtable-arm.c \
            drivers/iommu/arm/arm-smmu/arm-smmu-qcom.c \
            drivers/iommu/arm/arm-smmu/arm-smmu.c \
            drivers/iommu/arm/arm-smmu/arm-smmu.h \
            include/linux/io-pgtable.h \
            drivers/gpu/drm/msm/adreno/a6xx_hfi.c \
            drivers/gpu/drm/msm/adreno/a6xx_hfi.h \
            drivers/gpu/drm/msm/registers/adreno/a6xx_gmu.xml \
            drivers/gpu/drm/msm/adreno/a6xx_gpu.h \
            include/soc/qcom/tcs.h \
            drivers/soc/qcom/cmd-db.c \
            include/soc/qcom/cmd-db.h \
            drivers/gpu/drm/msm/msm_gem.c \
            drivers/gpu/drm/msm/msm_gem_vma.c \
            include/linux/iommu.h \
            drivers/gpu/drm/msm/registers/adreno/adreno_common.xml \
          ; do
            mkdir -p "$AC/$(dirname "$f")"
            curl -fsSL "$LC/$f" -o "$AC/$f" || echo "SRC FAIL $f"
          done
          mkdir -p "$AC/mesa/src/freedreno/common"
          curl -fsSL "https://chromium.googlesource.com/external/gitlab.freedesktop.org/mesa/mesa/+/85fda3b36405bcaea8bffc64aa4f2651dc90770d/src/freedreno/common/freedreno_pm4.h?format=TEXT" | base64 -d > "$AC/mesa/src/freedreno/common/freedreno_pm4.h" || echo "MESA FAIL"
          find "$AC" -type f | wc -l | tee -a "$LOG2"
          sha256sum "$FW"/sheng-gpu/qcom/a740_sqe.fw "$FW"/sheng-gpu/qcom/gmu_gen70200.bin "$FW"/sheng-gpu/qcom/sm8550/sheng/a740_zap.mbn "$FW"/fuxi-gpu/qcom/gmu_gen70200.bin "$FW"/fuxi-gpu/qcom/sm8550/fuxi/a740_sqe.fw "$FW"/fuxi-gpu/qcom/sm8550/fuxi/a740_zap.mbn | tee -a "$LOG2"
          echo "=== IPSW: fetch the pinned volumes for the verified-root archive ===" | tee -a "$LOG2"
          ./unixnu ipsw fetch 2>&1 | tail -25 | tee -a "$LOG2"
          echo "IPSW_EXIT=$?" | tee -a "$LOG2"
          ls -l out/ipsw/*/*.dmg 2>/dev/null | tee -a "$LOG2" || true
          echo "=== BUILD: compile -> archives -> link ===" | tee -a "$LOG2"
          rm -f out/fuxi/tree/scripts/data/adreno-inputs.json out/fuxi/tree/scripts/data/fuxi-adreno-inputs.json
          echo "pins patched earlier; see the zap step output" | tee -a "$LOG2"
          ./unixnu build kernel 2>&1 | tee -a "$LOG2"
          echo "KERNEL_EXIT=$?" | tee -a "$LOG2"
          echo "=== payload ===" | tee -a "$LOG2"
          ./unixnu build payload 2>&1 | tee -a "$LOG2"
          echo "PAYLOAD_EXIT=$?" | tee -a "$LOG2"
          cp "$LOG2" /tmp/build-payload.log 2>/dev/null
      - name: Collect archive logs
        if: always()
        run: |
          set +e
          mkdir -p ourrepo/ci-logs-official
          for f in unixnu/out/fuxi/logs/archive-*.log unixnu/out/fuxi/logs/kernel*.log unixnu/out/fuxi/logs/payload*.log unixnu/out/fuxi/logs/prelink*.log; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            cp "$f" "ourrepo/ci-logs-official/$b"
          done
          ls -l ourrepo/ci-logs-official || true

      - name: 列出产物
        if: always()
        working-directory: unixnu
        run: |
          set +e
          echo "===== 产物 ====="
          find . -maxdepth 7 \( -name 'mach.*' -o -name 'kernel.*' -o -name 'payload.img' -o -name 'payload.json' -o -name 'boot.img' \) 2>/dev/null | head -40 || true
          ls -la build 2>/dev/null | head -20
          ls -l out/fuxi/kernel/kernel.macho out/fuxi/payload/payload.img 2>/dev/null
          true

      - name: 上传内核
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-kernel-unixnu
          path: |
            unixnu/build/**
            /tmp/build-kernel.log
          if-no-files-found: warn
          retention-days: 14

      - name: 上传二进制到 Release
        id: release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: unixnu
        run: |
          set +e
          TAG="fuxi-$(date +%Y%m%d-%H%M%S)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          files=""
          for f in out/fuxi/payload/payload.img out/fuxi/kernel/kernel.macho; do
            [ -f "$f" ] && files="$files $f"
          done
          echo "assets:$files"
          if [ -n "$files" ]; then
            gh release create "$TAG" $files --repo "$GITHUB_REPOSITORY" \
              --title "fuxi unixnu build $TAG" --notes "kernel + payload" || echo "release failed"
          fi

      - name: 把文本日志推到 ci-logs
        if: always()
        working-directory: ourrepo
        run: |
          set +e
          mkdir -p ci-logs-official/unixnu-logs
          cp ci-logs-official/pass2.log ci-logs-official/build-kernel2.log 2>/dev/null
          cp /tmp/build-kernel.log ci-logs-official/build-kernel.log 2>/dev/null
          cp /tmp/build-payload.log ci-logs-official/build-payload.log 2>/dev/null
          cp -r ../unixnu/out/fuxi/logs/. ci-logs-official/unixnu-logs/ 2>/dev/null
          {
            echo "=== 产物 ==="
            ls -l ../unixnu/out/fuxi/kernel/kernel.macho ../unixnu/out/fuxi/payload/payload.img 2>/dev/null
            echo
            echo "=== Release tag ==="
            echo "${{ steps.release.outputs.tag }}"
            echo
            echo "=== payload 日志尾部 80 行 ==="
            tail -80 /tmp/build-payload.log 2>/dev/null
          } > ci-logs-official/tail.txt
          git config user.name "xnu-bot"
          git config user.email "xnu-bot@users.noreply.github.com"
          git checkout -f --orphan official-logs-tmp
          git add -f ci-logs-official
          git commit -qm "unixnu fuxi kernel log" || true
          git push -f origin HEAD:ci-logs || echo "push failed"
