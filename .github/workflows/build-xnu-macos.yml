name: build-xnu-macos

# 用 UniXNU 官方方法在 macOS runner 上编 XNU 内核。
#
# 官方流程（docs/guide/build-kernel.md「Build sequence」）：
#   1. unixnu fetch                     克隆 XNU 与 Apple 参考源
#   2. unixnu build kernel              打补丁、编 XNU（此时还没有那些 lib*.a）
#   3. 构建设备 archive                  用第 2 步留下的 .cpo.json 编译每个 .a
#   4. unixnu build kernel              第二次，链接 archive
#   5. unixnu build prelink             产出 kernel.macho
#
# 关键：lib*.a 的源码在 UniXNU/drivers/，构建脚本在
# UniXNU-sheng/scripts/build-arm-driver.py（文档说 "The device repository
# owns the scripts that produce its archives"），所以要把设备仓库的
# scripts/ 叠加到 UniXNU 树上运行。

on:
  push:
    paths:
      - ".github/workflows/build-xnu-macos.yml"
      - "vendor/UniXNU-full.tar.gz"
      - "vendor/UniXNU-sheng-full.tar.gz"
      - "xnu/patches/**"
  workflow_dispatch:
    inputs:
      xnu_tag:
        description: "XNU tag（默认官方 10063 = iOS 17）"
        required: false
        default: "xnu-10063.141.1"
      xnu_commit:
        description: "XNU commit"
        required: false
        default: "d8b80295118ef25ac3a784134bcf95cd8e88109f"
      xnu_darwin:
        description: "Darwin 版本"
        required: false
        default: "23.6.0"
      xnu_version:
        description: "XNU 版本号"
        required: false
        default: "10063.141.1"

concurrency:
  group: xnu-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300

    steps:
      - name: 取本仓库
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            vendor
          sparse-checkout-cone-mode: false

      - name: 环境信息
        run: |
          set -eux
          sw_vers
          xcode-select -p
          xcodebuild -version || true
          sysctl -n hw.ncpu

      - name: 组装源码树
        run: |
          set -euxo pipefail
          echo "PWD=$(pwd)"
          echo "--- 根目录 ---"
          ls -la
          echo "--- vendor ---"
          ls -la vendor/ || { echo "没有 vendor 目录"; exit 1; }
          # vendor/UniXNU-full.tar.gz 里的文件是顶层存放的（没有 UniXNU/ 前缀），
          # 直接解到当前目录会散成一地，所以先建目录再解进去。
          mkdir -p UniXNU
          tar -xzf vendor/UniXNU-full.tar.gz -C UniXNU
          ls UniXNU/scripts >/dev/null || { echo "UniXNU 解包失败"; ls -la UniXNU | head -20; exit 1; }
          mkdir -p _sheng
          tar -xzf vendor/UniXNU-sheng-full.tar.gz -C _sheng
          SHENG=_sheng/UniXNU-sheng

          # build-arm-driver.py 里 ROOT = scripts/../ 即 UniXNU 根，
          # 它读 ROOT/drivers/<comp>/<comp>.cpp 和
          # ROOT/build/xnu/.../*.cpo.json。所以把设备仓库 scripts 叠进去。
          cp -a "$SHENG/scripts/." UniXNU/scripts/

          # kits/NativePrelink 的两个补丁对 xnu-10063.141.1 的 OSKext.cpp 打不上
          # （security-init.patch / sparse-index.patch），它们是预链接 kext 的支持
          # 补丁，启动本身不需要。
          # 注意：光删文件不行——脚本第 43 行的 for 循环会保留字面量 glob，
          # git apply 会报 "can't open patch ... *.patch"。所以直接把那一行里
          # 第二个 glob 去掉，只保留 patches/xnu。
          sed -i '' 's# "$ROOT"/kits/NativePrelink/patches/\*.patch##' UniXNU/scripts/build-xnu-4k-baseline.sh
          echo "--- 第 43 行现在是 ---"
          sed -n '43p' UniXNU/scripts/build-xnu-4k-baseline.sh

          test -f UniXNU/scripts/build-xnu-4k-baseline.sh
          test -f UniXNU/scripts/build-arm-driver.py
          test -f UniXNU/drivers/NativeUfs/NativeUfs.cpp
          echo "补丁数: $(ls UniXNU/patches/xnu/*.patch | wc -l)"

      - name: 装依赖
        run: |
          set -euxo pipefail
          brew install cmake ninja unifdef || true
          echo "--- 逐个确认工具 ---"
          for t in git make clang cmake ninja unifdef python3 ditto xcrun; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "OK   $t"
            else
              echo "MISS $t"
            fi
          done

      - name: 准备 availability.pl
        run: |
          set -uo pipefail
          SDK="$(xcrun --sdk macosx --show-sdk-path 2>/dev/null || true)"
          echo "SDK=$SDK"
          if [ -n "$SDK" ]; then
            AVA="$SDK/usr/local/libexec/availability.pl"
            if [ ! -x "$AVA" ]; then
              mkdir -p "$(dirname "$AVA")" 2>/dev/null || echo "(SDK 只读)"
              printf '#!/usr/bin/env perl\nexit 0;\n' > "$AVA" 2>/dev/null || echo "(无法写入 SDK)"
              chmod +x "$AVA" 2>/dev/null || true
            fi
            echo "availability.pl: $AVA"
          fi
          echo "此步不阻塞后续"

      # prepare-xnu-source.py 用匿名 GitHub API 取 DriverKit 头文件清单，
      # 匿名限额每小时 60 次，跑几次就 403 rate limit exceeded。
      # 这里给它的 urllib 调用加 Authorization 头（GITHUB_TOKEN 限额 5000/h）。
      - name: 给 prepare-xnu-source.py 加 API token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          F=UniXNU/scripts/prepare-xnu-source.py
          cp "$F" "$F.orig"
          # 关键：重写 restore()，用 git/blobs API 拉文件内容。
          # 原来的实现是 _open(entry['download_url'])，那是
          # raw.githubusercontent.com，token 对它无效、也有匿名限额，
          # 第 15 次跑就是在这里 HTTPError 403。
          # git/blobs 走 api.github.com，Bearer token 生效（5000/h）。
          python3 - "$F" <<'PY'
          import sys, io
          p = sys.argv[1]
          t = io.open(p, encoding='utf-8').read()
          if 'git-blobs-v2' in t:
              print('already patched'); raise SystemExit(0)

          # 1) 在 import 区后插入 _blob_fetch
          t = t.replace(
              "import urllib.request\n",
              "import urllib.request\n"
              "_TOKEN = os.environ.get('GITHUB_TOKEN') or os.environ.get('GH_TOKEN') or ''\n"
              "def _open(url, timeout=60):\n"
              "    req = urllib.request.Request(url)\n"
              "    if _TOKEN:\n"
              "        req.add_header('Authorization', 'Bearer ' + _TOKEN)\n"
              "    req.add_header('User-Agent', 'unixnu-build')\n"
              "    req.add_header('Accept', 'application/vnd.github+json')\n"
              "    return urllib.request.urlopen(req, timeout=timeout)\n"
              "def _blob_fetch(sha, repo='apple-oss-distributions/xnu'):\n"
              "    # git-blobs-v2: fetch by blob sha through the API so the token applies\n"
              "    import base64, json as _json\n"
              "    url = 'https://api.github.com/repos/' + repo + '/git/blobs/' + sha\n"
              "    doc = _json.loads(_open(url).read())\n"
              "    return base64.b64decode(doc['content'])\n",
              1)

          # 2) restore() 里把 download_url 换成 _blob_fetch(entry['sha'])
          t = t.replace(
              "data = urllib.request.urlopen(_request(entry['download_url']), timeout=30).read()",
              "data = _blob_fetch(entry['sha'])")

          # 3) 其余 urlopen / _request 调用统一走 _open
          t = t.replace("urllib.request.urlopen(_request(URL), timeout=30).read()", "_open(URL).read()")
          t = t.replace("urllib.request.urlopen(_request(crypto_url), timeout=30).read()", "_open(crypto_url).read()")
          t = t.replace("urllib.request.urlopen(_request(url), timeout=30).read()", "_open(url).read()")

          io.open(p, 'w', encoding='utf-8').write(t)
          print('patched', p)
          PY
          echo "--- 补丁后的关键行 ---"
          grep -n "_open\|_blob_fetch\|download_url" "$F" | head -20 || true

      - name: 第 1 步 - 编 XNU 基线（产出 cpo.json）
        env:
          # prepare-xnu-source.py 在这个步骤里被调用，它用 secrets.GITHUB_TOKEN
          # 走 git/blobs API 取 DriverKit 头文件；不传进来就是匿名额度（60/h），
          # 一超就 HTTP 403 rate limit exceeded。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNIXNU_XNU_TAG: ${{ github.event.inputs.xnu_tag || 'xnu-10063.141.1' }}
          UNIXNU_XNU_COMMIT: ${{ github.event.inputs.xnu_commit || 'd8b80295118ef25ac3a784134bcf95cd8e88109f' }}
          UNIXNU_XNU_DARWIN: ${{ github.event.inputs.xnu_darwin || '23.6.0' }}
          UNIXNU_XNU_VERSION: ${{ github.event.inputs.xnu_version || '10063.141.1' }}
          JOBS: "6"
          # 对齐 hanzi123-bilp/unixnu-fuxi 的 configs/fuxi_defconfig。
          # 第 1 步只要自洽就行（NATIVE_ARCH_TIMER=1 必须配 ARMCPU=1，
          # 否则 build-xnu-4k-baseline.sh L509 直接 exit 1），
          # 但 fuxi_defconfig 里 CONFIG_XNU_ARMCPU=y 且 CONFIG_XNU_NATIVE_UFS=y，
          # 所以下面按 defconfig 全开。
          XNU_SOURCE_CORECRYPTO14: "1"
          XNU_SOURCE_PTHREAD: "1"
          XNU_ARM_DT_PLATFORM: "1"
          XNU_ARMVIRT_PLATFORM: "0"
          XNU_ARMCPU: "1"
          XNU_NATIVE_UFS: "1"
          XNU_NATIVE_AES: "1"
          XNU_NATIVE_VIRTIO_BLOCK: "0"
          XNU_NATIVE_RAM_BLOCK: "0"
          XNU_NATIVE_VIRTIO_CONSOLE: "0"
          XNU_NATIVE_MOBILE_DISPLAY: "0"
          XNU_NATIVE_LEGACY_DISPLAY: "0"
          XNU_NATIVE_ADRENO: "0"
          XNU_NATIVE_OFFLINE_GPU: "0"
          XNU_VERIFIED_ROOT_PROBE: "0"
          XNU_OWNER_ROOT_AUDIT: "0"
          XNU_OWNER_ROOT_TRUST: "0"
          XNU_SHENG_PMGR: "0"
          XNU_SOURCE_MOCKFS: "0"
          XNU_BOOT_PROGRESS: "0"
          XNU_SMMU4K_PROBE: "0"
          XNU_ADRENO_FIRMWARE_PROBE: "0"
          XNU_ADRENO_PM4_PROBE: "0"
          XNU_CONSTANT_UPLOADS_PROBE: "0"
          XNU_NATIVE_CS_HASH_CACHE: "1"
          XNU_NATIVE_ARCH_TIMER: "1"
          XNU_NATIVE_PAN: "1"
          XNU_DT_PANIC_REGION: "1"
          XNU_TRUST_CACHE_RUNTIME: "1"
          XNU_ZONE_PGZ_ALIGNMENT_PROBE: "1"
          XNU_CRYPTO_BOOTSTRAP: "prelinked"
          XNU_BUILD_WERROR: "0"
          # 对齐 unixnu 驱动 scripts/unixnu/kernel.py L80-94 的第一遍：
          # 从零编译时先跑一次 XNU_BOOTSTRAP=1 的 pass，跳过 archive 检查、
          # 只产出编译记录（startup.o.json / *.cpo.json），
          # 然后才 build_archives + 第二遍完整链接。
          XNU_BOOTSTRAP: "1"
          # 官方顺序：先只装头文件铺好 fakeroot，再编 archive，最后链接。
          XNU_BUILD_TARGET: "installhdrs"
        run: |
          set -euo pipefail
          cd UniXNU
          PS4='+ [$LINENO] '
          if ! bash -x scripts/build-xnu-4k-baseline.sh > step1.log 2>&1; then
            rc=$?
            echo "===== 第 1 步失败，trace 尾部 ====="
            tail -150 step1.log
            cp step1.log "$GITHUB_WORKSPACE/step1.log"
            exit $rc
          fi
          cp step1.log "$GITHUB_WORKSPACE/step1.log"
          echo "第 1 步成功"

          echo "===== ios-obj 顶层 ====="
          ls -la build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/ 2>/dev/null | head -30 || echo "(目录不存在)"

          echo "===== iokit/DEVELOPMENT 目录 ====="
          ls -la build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/iokit/DEVELOPMENT/ 2>/dev/null | head -40 || echo "(目录不存在)"

          echo "===== 所有 .json 记录 ====="
          find build/xnu/ios-obj -name "*.json" 2>/dev/null | head -20 || echo "(没有 .json)"
          echo "json 总数: $(find build/xnu/ios-obj -name '*.json' 2>/dev/null | wc -l)"

          echo "===== 所有 .o / .cpo ====="
          echo "o 总数:   $(find build/xnu/ios-obj -name '*.o' 2>/dev/null | wc -l)"
          echo "cpo 总数: $(find build/xnu/ios-obj -name '*.cpo' 2>/dev/null | wc -l)"

          echo "===== 目标文件 ====="
          find build/xnu -name "mach.development.bcm2837*" 2>/dev/null | head -5 || echo "(没有内核产物)"

          echo "===== step1.log 中的 -MJ 行 ====="
          grep -o '\-MJ [^ ]*' step1.log 2>/dev/null | head -5 || echo "(日志里没有 -MJ)"

      # ── 第 2 步：用设备仓库脚本编出 lib*.a ────────────────────
      - name: 第 2 步 - 编设备 archive
        run: |
          set -uo pipefail
          cd UniXNU
          COMPS=(ArmDTPlatform ArmCpu NativeUfs NativeAES NativeVirtioBlock \
                 NativeRamBlock NativeVirtioConsole NativeLegacyDisplay \
                 NativeMobileDisplay NativeAdreno)
          ok=""; bad=""

          # 先把 cpo.json 的位置和内容摸清楚，失败时这就是唯一线索
          echo "===== cpo.json 位置 ====="
          find build -name "IOPlatformExpert.cpo.json" 2>/dev/null | head -5 || true
          echo "===== ios-obj 下的 json 总数 ====="
          find build/xnu/ios-obj -name "*.json" 2>/dev/null | wc -l || true
          echo "===== build/xnu/ios-obj 顶层 ====="
          ls build/xnu/ios-obj 2>/dev/null || echo "(缺 build/xnu/ios-obj)"
          echo "===== iokit 目录 ====="
          ls build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/iokit 2>/dev/null || echo "(缺 iokit)"
          ls build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/iokit/DEVELOPMENT 2>/dev/null || echo "(缺 iokit/DEVELOPMENT)"

          for c in "${COMPS[@]}"; do
            echo "::group::build-arm-driver.py $c"
            if python3 scripts/build-arm-driver.py "$c" > "step2-$c.log" 2>&1; then
              echo "OK   $c"; ok="$ok $c"
            else
              echo "FAIL $c"
              echo "----- step2-$c.log 全部输出 -----"
              cat "step2-$c.log" || true
              bad="$bad $c"
            fi
            echo "::endgroup::"
            cp "step2-$c.log" "$GITHUB_WORKSPACE/" 2>/dev/null || true
          done
          echo "---- 汇总 ----"
          echo "成功:$ok"
          echo "失败:${bad:- 无}"
          echo "---- build/ 下的 .a ----"
          find build -name "*.a" | head -40 || true

          # 把失败详情写进 step summary，这样从 API 的 jobs 响应就能读到
          {
            echo "## step2 结果"
            echo "- 成功: \`$ok\`"
            echo "- 失败: \`${bad:-无}\`"
            for c in $bad; do
              echo ""
              echo "### $c 失败日志（最后 60 行）"
              echo '```'
              tail -60 "step2-$c.log" 2>/dev/null || echo "(无日志)"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

          [ -n "$ok" ] || { echo "一个 archive 都没编出来"; exit 1; }

      # ── 第 3 步：archive 齐了，再跑一次做完整链接 ─────────────────
      - name: 第 3 步 - 完整链接（带设备 archive）
        env:
          # prepare-xnu-source.py 在这个步骤里被调用，它用 secrets.GITHUB_TOKEN
          # 走 git/blobs API 取 DriverKit 头文件；不传进来就是匿名额度（60/h），
          # 一超就 HTTP 403 rate limit exceeded。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNIXNU_XNU_TAG: ${{ github.event.inputs.xnu_tag || 'xnu-10063.141.1' }}
          UNIXNU_XNU_COMMIT: ${{ github.event.inputs.xnu_commit || 'd8b80295118ef25ac3a784134bcf95cd8e88109f' }}
          UNIXNU_XNU_DARWIN: ${{ github.event.inputs.xnu_darwin || '23.6.0' }}
          UNIXNU_XNU_VERSION: ${{ github.event.inputs.xnu_version || '10063.141.1' }}
          JOBS: "6"
          # 对齐 hanzi123-bilp/unixnu-fuxi 的 configs/fuxi_defconfig。
          # 第 1 步只要自洽就行（NATIVE_ARCH_TIMER=1 必须配 ARMCPU=1，
          # 否则 build-xnu-4k-baseline.sh L509 直接 exit 1），
          # 但 fuxi_defconfig 里 CONFIG_XNU_ARMCPU=y 且 CONFIG_XNU_NATIVE_UFS=y，
          # 所以下面按 defconfig 全开。
          XNU_SOURCE_CORECRYPTO14: "1"
          XNU_SOURCE_PTHREAD: "1"
          XNU_ARM_DT_PLATFORM: "1"
          XNU_ARMVIRT_PLATFORM: "0"
          XNU_ARMCPU: "1"
          XNU_NATIVE_UFS: "1"
          XNU_NATIVE_AES: "1"
          XNU_NATIVE_VIRTIO_BLOCK: "0"
          XNU_NATIVE_RAM_BLOCK: "0"
          XNU_NATIVE_VIRTIO_CONSOLE: "0"
          XNU_NATIVE_MOBILE_DISPLAY: "0"
          XNU_NATIVE_LEGACY_DISPLAY: "0"
          XNU_NATIVE_ADRENO: "0"
          XNU_NATIVE_OFFLINE_GPU: "0"
          XNU_VERIFIED_ROOT_PROBE: "0"
          XNU_OWNER_ROOT_AUDIT: "0"
          XNU_OWNER_ROOT_TRUST: "0"
          XNU_SHENG_PMGR: "0"
          XNU_SOURCE_MOCKFS: "0"
          XNU_BOOT_PROGRESS: "0"
          XNU_SMMU4K_PROBE: "0"
          XNU_ADRENO_FIRMWARE_PROBE: "0"
          XNU_ADRENO_PM4_PROBE: "0"
          XNU_CONSTANT_UPLOADS_PROBE: "0"
          XNU_NATIVE_CS_HASH_CACHE: "1"
          XNU_NATIVE_ARCH_TIMER: "1"
          XNU_NATIVE_PAN: "1"
          XNU_DT_PANIC_REGION: "1"
          XNU_TRUST_CACHE_RUNTIME: "1"
          XNU_ZONE_PGZ_ALIGNMENT_PROBE: "1"
          XNU_CRYPTO_BOOTSTRAP: "prelinked"
          XNU_BUILD_WERROR: "0"
          # 对齐 unixnu 驱动 scripts/unixnu/kernel.py L80-94 的第一遍：
          # 从零编译时先跑一次 XNU_BOOTSTRAP=1 的 pass，跳过 archive 检查、
          # 只产出编译记录（startup.o.json / *.cpo.json），
          # 然后才 build_archives + 第二遍完整链接。
          XNU_BOOTSTRAP: "1"
          # 官方顺序：先只装头文件铺好 fakeroot，再编 archive，最后链接。
        run: |
          set -uo pipefail
          cd UniXNU
          if ! bash -x scripts/build-xnu-4k-baseline.sh > step3.log 2>&1; then
            echo "===== 第 3 步失败，trace 尾部 ====="
            tail -60 step3.log
            cp step3.log "$GITHUB_WORKSPACE/step3.log"
            exit 1
          fi
          cp step3.log "$GITHUB_WORKSPACE/step3.log"
          echo "===== 内核产物 ====="
          find build/xnu -name 'mach.development.bcm2837*' | head -5
          mkdir -p "$GITHUB_WORKSPACE/out-kernel"
          cp build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf \
             "$GITHUB_WORKSPACE/out-kernel/mach.development.bcm2837" || true
          ls -la "$GITHUB_WORKSPACE/out-kernel" || true

      - name: 产物检查
        if: always()
        run: |
          set -eux
          cd UniXNU || exit 0
          echo "=== cpo.json ==="
          find build/xnu/ios-obj -name "IOPlatformExpert.cpo.json" 2>/dev/null | head -3 || true
          echo "=== 内核 ==="
          find build/xnu -name "mach.development.bcm2837*" 2>/dev/null | head -10 || true

      # 日志 artifact 下载要认证，这里把失败的 step2 日志直接提交到
      # ci-logs 分支的根目录，用 raw.githubusercontent.com 就能匿名读到。
      - name: 失败日志推到 ci-logs 分支
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          ls -la step2-*.log 2>/dev/null || { echo "没有 step2 日志"; exit 0; }
          mkdir -p /tmp/logs && cp step2-*.log /tmp/logs/ 2>/dev/null || true
          [ -f UniXNU/step1.log ] && cp UniXNU/step1.log /tmp/logs/ || true
          [ -f step1.log ] && cp step1.log /tmp/logs/ || true
          cd /tmp/logs
          ls -la
          git init -q .
          git config user.name  "ci-bot"
          git config user.email "ci@localhost"
          git add -A
          git commit -q -m "logs run ${{ github.run_number }}" || { echo "无变化"; exit 0; }
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-logs 2>&1 | tail -5 || true

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-macos-log-${{ github.run_number }}
          path: |
            step1.log
            step2-*.log
            UniXNU/step1.log
            UniXNU/step2-*.log
          if-no-files-found: warn
          retention-days: 7
